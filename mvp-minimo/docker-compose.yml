name: apobot-knowledge-minimo

services:
  api:
    build: .
    ports: ["5087:5087"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Cases: Host=postgres;Port=5432;Database=${POSTGRES_DB:-apobot};Username=${POSTGRES_USER:-apobot};Password=${POSTGRES_PASSWORD:-apobot_dev_only}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
    depends_on:
      postgres: { condition: service_healthy }
      ollama-init: { condition: service_completed_successfully }
  ollama:
    image: ollama/ollama:0.34.1
    volumes: [ollama-data:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
  ollama-init:
    image: ollama/ollama:0.34.1
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
    depends_on:
      ollama: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command: ["for i in 1 2 3 4 5 6 7 8; do ollama pull \"$${OLLAMA_MODEL}\" && exit 0; sleep 15; done; exit 1"]
    restart: "no"
  postgres:
    build: ./docker/postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apobot}
      POSTGRES_USER: ${POSTGRES_USER:-apobot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apobot_dev_only}
    ports: ["5447:5432"]
    volumes:
      - apobot-minimal-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apobot -d apobot"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  apobot-minimal-data:
  ollama-data:
