<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APObot IA · MVP manual</title><style>body{font:16px system-ui;background:#10151f;color:#e8eef7;max-width:1000px;margin:auto;padding:28px}section{background:#192231;border:1px solid #34445a;border-radius:14px;padding:18px;margin:14px 0}input,button{padding:11px;border-radius:8px;border:1px solid #52647b;background:#101722;color:white}input{width:70%}button{background:#168dcc;cursor:pointer}pre{background:#0c1119;padding:14px;border-radius:9px;white-space:pre-wrap}.item{border-top:1px solid #34445a;padding:12px 0}.source{color:#78d6ff;font-size:13px}</style><h1>APObot IA · MVP del manual</h1><p>Única fuente: Guia_por_averias_orden_parametrizacion_S_B_P.pdf</p><section><b id="health">Conectando…</b><h2>Pregunta al manual</h2><input id="q" placeholder="¿Qué valor debe tener KG+ del eje S?"><button onclick="ask()">Consultar</button><pre id="answer">La respuesta será resumida por Ollama y citará las páginas recuperadas.</pre></section><section><h2>Fragmentos recuperados</h2><input id="f" placeholder="Buscar por palabra" oninput="load()"><div id="list"></div></section><script>async function get(u,o){return(await fetch(u,o)).json()}async function load(){let q=f.value,x=await get('/api/manuals'+(q?'?q='+encodeURIComponent(q):''));list.innerHTML=x.map(v=>'<div class=item><b>Página '+v.page+' · '+v.section+'</b><p>'+v.content+'</p><span class=source>'+v.source+'</span></div>').join('')}async function ask(){answer.textContent='Consultando…';let x=await get('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q.value})});answer.textContent=(x.mode?'Modo: '+x.mode+'\n\n':'')+(x.answer||x.error)}get('/api/health').then(x=>health.textContent=x.connected?'SQL conectado · '+x.manuals+' manual · '+x.chunks+' fragmentos · '+x.cases+' casos':'SQL sin conexión');load()</script></html>
